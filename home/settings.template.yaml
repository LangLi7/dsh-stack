# ---------------------------------------------------------------------------
# Default agent model: routed through the crew, so the crew decides per role.
# ---------------------------------------------------------------------------
agent-default-model:
  provider: crew
  model: crew-1
  reasoningEffort: given

# ---------------------------------------------------------------------------
# Web search: the same endpoint as the profile patch. apiKey stays empty for a
# keyless local instance; the cloud fallback key is a credential ref.
# ---------------------------------------------------------------------------
web-search-firecrawl:
  baseURL: http://127.0.0.1:3002
  apiKey: ""
  limit: 25
locale:

# ---------------------------------------------------------------------------
# User interface language.
# ---------------------------------------------------------------------------
  preference: de
llm-deepseek:

# ---------------------------------------------------------------------------
# Custom DeepSeek model entries: context windows and image limits.
# ---------------------------------------------------------------------------
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek-V4-Flash-Vision-Exp
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
    - id: deepseek-flash
      name: deepseek-flash

# ---------------------------------------------------------------------------
# German localization plugin.
# ---------------------------------------------------------------------------
dsh-i18n-de:
  enabled: true
crew:

# ---------------------------------------------------------------------------
# Crew: role -> provider/model/effort. Replace the model ids with what your own
# account can reach; the ids below are the ones this stack was built with.
# ---------------------------------------------------------------------------
crew:
  crews:
    - id: crew-1
      name: DeepSeek Counsel
      roles:
        vision:
          provider: deepseek-official
          model: deepseek-v4-flash-vision-exp
          reasoningEffort: high
        executor:
          provider: deepseek-official
          model: deepseek-flash
          reasoningEffort: high
        planner:
          provider: deepseek-official
          model: deepseek-v4-pro
          reasoningEffort: max
        reviewer:
          provider: deepseek-official
          model: deepseek-v4-pro
          reasoningEffort: high
        helper:
          provider: deepseek-official
          model: deepseek-v4-flash
          reasoningEffort: auto
    - id: crew-2
      name: Test RouterFree
      roles:
        vision:
          provider: deepseek-official
          model: deepseek-flash
        executor:
          provider: openrouter
          model: openrouter/free
        planner:
          provider: deepseek-official
          model: deepseek-v4-pro
        reviewer:
          provider: deepseek-official
          model: deepseek-v4-pro
        helper:
          provider: deepseek-official
          model: deepseek-flash

# ---------------------------------------------------------------------------
# Agent loop: tool calls the model may issue in parallel.
# ---------------------------------------------------------------------------
agent-loop:
  maxParallelToolCalls: 9
