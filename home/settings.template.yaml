# Portable harness settings — the sections of a working $DSH_HOME/settings.yaml
# that describe intent rather than machine state.
#
# NOT applied automatically: DSH writes settings.yaml on first start, and the
# live file carries UI state (ui-onboarding) and machine-specific paths that do
# not belong in a shared repository. Merge the sections you want by hand, or
# copy this file to $DSH_HOME/settings.yaml on a machine that has no settings
# file yet.
#
# No API keys appear here: every provider reads its key from the named
# environment variable / credential ref. See docs/PROVIDERS.md.

# ---------------------------------------------------------------------------
# Provider catalog (llm-pi-ai): 11 providers with their model lists. Long
# because explicit — trim what you do not use.
# ---------------------------------------------------------------------------
