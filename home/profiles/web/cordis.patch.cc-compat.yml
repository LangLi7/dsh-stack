# dsh profile patch layer — ADD-ON: Claude-Code plugin compatibility.
#
# Do NOT append this file by hand before the generated artifacts exist: the
# loader fails loud on a missing `configPath`. `install.ps1 -Features
# base,cc-compat` (or `install.sh`) appends it automatically AFTER running
# `cc-compat/plugin-install.mjs`, which is what writes those files.
#
# Paths are derived from the harness home with `dshHomePath(...)`, so this
# file is machine-independent. Everything it points at lives under
# `$DSH_HOME/cc-compat` and `$DSH_HOME/cc-sources`, both created by the
# installer.

# ---------------------------------------------------------------------------
# Skill roots: the compiled CC skills, one root per source repository.
# The skill-filesystem provider reads only DIRECT children of a root, which
# is why each source gets its own entry rather than one parent directory.
# This is additive — the default roots (`$DSH_HOME/skills`,
# `$DSH_AGENTS_HOME/skills`, project roots) stay active, so these rows only
# raise the ranking of the CC skills.
#
# The repository list is the same as `cc-compat/repos.txt`. If you trim that
# list, trim these rows to match.
#
# `disabled: false` is NOT repeated here: the base layer already mounts the
# provider, and two id-targeted patches for the same row would make the
# composition harder to read for no gain.
# ---------------------------------------------------------------------------
- id: skill-filesystem
  config:
    customSkillDirs:
      - !!js dshHomePath('skills', 'cc-Imbad0202__academic-research-skills')
      - !!js dshHomePath('skills', 'cc-SnailSploit__claude-red')
      - !!js dshHomePath('skills', 'cc-mukul975__anthropic-cybersecurity-skills')
      - !!js dshHomePath('skills', 'cc-K-Dense-AI__scientific-agent-skills')
      - !!js dshHomePath('skills', 'cc-rohitg00__agentmemory')
      - !!js dshHomePath('skills', 'cc-cathrynlavery__diagram-design')
      - !!js dshHomePath('skills', 'cc-affaan-m__ECC')

# ---------------------------------------------------------------------------
# Plugin hooks, generated by `cc-compat/plugin-install.mjs` and mounted from
# `cc-compat/generated-hooks/<plugin>.json` — never from the source
# `hooks.json`.
#
# Two mismatches are repaired in the generated copy: matchers are translated
# to dsh tool names (Bash -> pwsh, Write -> write, Edit -> edit), and a
# command that spawned its entry script through ECC's bootstrap is routed
# through `hook-shim.cjs`, which loads the entry in-process because dsh's
# shell denies a hook child the pipes a piped spawn needs. Events dsh has no
# extension point for (PreCompact, PostToolUseFailure, SessionEnd,
# Notification, TaskCompleted) are dropped by the generator.
#
# Delete the rows for a plugin you did not install; a missing generated file
# is a load error, not a warning.
# ---------------------------------------------------------------------------
- insert:
    - id: hooks-ecc
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js dshHomePath('cc-compat', 'generated-hooks', 'ecc.json')
        pluginRoot: !!js dshHomePath('cc-sources', 'affaan-m__ECC')
    - id: hooks-agentmemory
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js dshHomePath('cc-compat', 'generated-hooks', 'agentmemory.json')
        pluginRoot: !!js dshHomePath('cc-sources', 'rohitg00__agentmemory', 'plugin')
    - id: hooks-academic-research-skills
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js dshHomePath('cc-compat', 'generated-hooks', 'academic-research-skills.json')
        pluginRoot: !!js dshHomePath('cc-sources', 'Imbad0202__academic-research-skills')
